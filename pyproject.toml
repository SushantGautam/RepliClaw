[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repliclaw"
version = "0.1.0"
description = "Blind commit/reveal decentralized replication & falsification collective built on ScienceClaw primitives"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sushant Gautam" }]
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "openai>=1.0",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
dev = ["pytest>=8.0"]

[project.scripts]
repliclaw = "repliclaw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

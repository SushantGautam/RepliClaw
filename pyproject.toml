[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repliclaw"
version = "0.1.0"
description = "Blind commit/reveal decentralized replication & falsification collective built on ScienceClaw primitives"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sushant Gautam" }]
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "openai>=1.0",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20", "openinference-semantic-conventions>=0.1"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
repliclaw = "repliclaw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Default (E, F, W) + a few high-signal rules; keep the set pragmatic for a
# research prototype rather than enforcing a full style opinion.
select = ["E", "F", "W", "I001", "B006", "B008"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src:deps/scienceclaw"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
# Vendored ScienceClaw `artifacts.*` and `networkx` ship without type stubs.
[[tool.mypy.overrides]]
module = ["artifacts.*", "networkx", "openai", "pydantic"]
ignore_missing_imports = true
follow_imports = "skip"
